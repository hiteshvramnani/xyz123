services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: data_collection
      POSTGRES_USER: dc_user
      POSTGRES_PASSWORD: dc_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dc_user -d data_collection"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
